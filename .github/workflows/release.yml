name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore src/Jellyfin.Plugin.SmartTmdb/Jellyfin.Plugin.SmartTmdb.csproj

      - name: Compute checksum
        id: checksum
        run: |
          $dll = "src/Jellyfin.Plugin.SmartTmdb/bin/Release/net10.0/Jellyfin.Plugin.SmartTmdb.dll"
          $hash = (Get-FileHash -Path $dll -Algorithm SHA256).Hash
          echo "checksum=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Update manifest.json
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $checksum = "${{ steps.checksum.outputs.checksum }}"
          $manifest = Get-Content manifest.json | ConvertFrom-Json
          $manifest.version = $version
          $manifest.downloads[0].version = $version
          $manifest.downloads[0].url = "https://github.com/${{ github.repository }}/releases/download/v$version/Jellyfin.Plugin.SmartTmdb.dll"
          $manifest.downloads[0].checksum = $checksum
          $manifest | ConvertTo-Json -Depth 10 | Set-Content manifest.json

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add manifest.json
          git commit -m "Update manifest.json for v${{ github.ref_name }}"
          git push

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src/Jellyfin.Plugin.SmartTmdb/bin/Release/net10.0/Jellyfin.Plugin.SmartTmdb.dll
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
