name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore src/Jellyfin.Plugin.SmartTmdb/Jellyfin.Plugin.SmartTmdb.csproj

      - name: Package plugin zip
        id: package
        shell: pwsh
        run: |
          $dll = "src/Jellyfin.Plugin.SmartTmdb/bin/Release/net10.0/Jellyfin.Plugin.SmartTmdb.dll"
          $version = "${{ github.ref_name }}".TrimStart('v')
          $zip = "Jellyfin.Plugin.SmartTmdb_$version.zip"
          Compress-Archive -Path $dll -DestinationPath $zip -Force
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Compute checksum
        id: checksum
        shell: pwsh
        run: |
          $zip = "${{ steps.package.outputs.zip }}"
          $hash = (Get-FileHash -Path $zip -Algorithm MD5).Hash
          "checksum=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Update manifest.json
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $checksum = "${{ steps.checksum.outputs.checksum }}"
          $ref = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $guid = "20410cf8-e5cd-4307-a355-87c6b66c9ae6"
          $entry = [ordered]@{
            version = $version
            changelog = "Release $ref"
            targetAbi = "12.0.0.0"
            sourceUrl = "https://github.com/$repo/releases/download/$ref/Jellyfin.Plugin.SmartTmdb_$version.zip"
            checksum = $checksum
            timestamp = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
          }

          # Read existing catalog (must be a JSON array of PackageInfo objects).
          $plugins = [System.Collections.Generic.List[PSObject]]::new()
          if (Test-Path manifest.json) {
            $existing = Get-Content manifest.json -Raw | ConvertFrom-Json
            if ($null -ne $existing -and $existing.Count -gt 0) {
              foreach ($p in $existing) {
                if ($p.guid -ne $guid) { $plugins.Add($p) | Out-Null }
              }
            }
          }

          $plugin = [ordered]@{
            guid = $guid
            name = "Smart TMDB Recommendations"
            description = "Configurable TMDB-based movie recommendations for Jellyfin."
            overview = "Configurable TMDB-based movie recommendations for Jellyfin."
            owner = "zetard"
            category = "Metadata"
            versions = @($entry)
          }
          $plugins.Add($plugin) | Out-Null

          # Emit a top-level JSON array explicitly. ConvertTo-Json on a
          # single-element collection drops the outer brackets, which makes
          # the file a single object and breaks PackageInfo[] deserialization.
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add("[") | Out-Null
          for ($i = 0; $i -lt $plugins.Count; $i++) {
            $json = $plugins[$i] | ConvertTo-Json -Depth 10
            $indent = $json.Replace("`n", "`n  ")
            $lines.Add("  $indent") | Out-Null
            if ($i -lt ($plugins.Count - 1)) { $lines.Add(",") | Out-Null }
          }
          $lines.Add("]") | Out-Null
          $lines -join "`n" | Set-Content manifest.json

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add manifest.json
          git commit -m "Update manifest.json for v${{ github.ref_name }}"
          git push origin master

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.package.outputs.zip }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}